# Agendador: a cada 30 minutos avisa o sistema para iniciar disparos agendados / retomar lotes parados.
# O endpoint não expõe nada e só dispara trabalho que já estava programado.
# Endereço: variável do repositório SITE_URL (Settings → Secrets and variables → Actions → Variables);
# sem ela, usa o domínio de produção do projeto na Vercel.
name: Disparos agendados
on:
  schedule:
    # 30 min (não 10): cada chamada acorda o banco, e o plano grátis do Neon tem 100 horas de uso por mês
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 30 -X POST "${SITE_URL:-https://ecossistema-api.vercel.app}/api/campanhas/kick" || true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
