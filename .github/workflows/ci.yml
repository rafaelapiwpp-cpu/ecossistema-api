# Verificação de todo push e PR: instala, confere os tipos e faz o build (sem banco: modo demonstração).
name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # sem package-lock no repositório (como na Vercel): instala pelas versões do package.json
      - run: npm install --no-audit --no-fund
      - name: Tipos
        run: npx tsc --noEmit -p .
      - name: Build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
